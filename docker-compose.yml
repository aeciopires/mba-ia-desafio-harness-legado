# Balcão: Postgres, migrations + seed, API, worker de triagem e front.
#
# Use `make up` / `make down` (ou scripts/up.sh e scripts/down.sh). Eles escolhem portas
# livres, geram .run/compose.env e usam um nome de projeto por cópia, para que duas
# worktrees rodem ao mesmo tempo sem dividir porta, banco, anexos nem worker.
# Sem esses scripts, os padrões abaixo reproduzem a configuração original (4000/5173/5432).

x-api-env: &api-env
  DATABASE_URL: postgresql://balcao:balcao@db:5432/balcao
  JWT_SECRET: ${JWT_SECRET:-dev-secret}
  AI_MODE: ${AI_MODE:-fake}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  UPLOAD_DIR: /data/uploads
  PORT: ${API_PORT:-4000}
  TRIAGE_INTERVAL_MS: ${TRIAGE_INTERVAL_MS:-2000}
  CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: balcao
      POSTGRES_PASSWORD: balcao
      POSTGRES_DB: balcao
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balcao -d balcao"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./api
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: *api-env
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/tsx prisma/seed.ts"]
    volumes:
      - ./api/prisma:/app/prisma:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: *api-env
    command: ["./node_modules/.bin/tsx", "watch", "src/main.ts"]
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    volumes:
      - ./api/src:/app/src:ro
      - ${UPLOADS_DIR:-./.run/uploads}:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: ./api
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: *api-env
    command: ["./node_modules/.bin/tsx", "watch", "src/jobs/triage-worker.ts"]
    volumes:
      - ./api/src:/app/src:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./web
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-4000}
      WEB_PORT: ${WEB_PORT:-5173}
      WEB_HOST: 0.0.0.0
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    volumes:
      - ./web/src:/app/src:ro
      - ./web/index.html:/app/index.html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
